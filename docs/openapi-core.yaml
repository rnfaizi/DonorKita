openapi: 3.1.0
info:
  title: DonorKita Core Service
  description: "\nLayanan inti pencocokan kebutuhan darah dengan pendonor sukarela.\
    \ Semua path relatif\nterhadap `/api` (base URL `https://donorkita.stei.site/api`).\n\
    \n**Autentikasi**\n- Pengguna aplikasi: `Authorization: Bearer <JWT>` dari `POST\
    \ /api/auth/login`.\n  Peran: `donor`, `requester`, `staff`, `admin`.\n- Kelompok\
    \ lain (server ke server): header `X-API-Key`. Endpoint baca publik\n  (`/donation-events`,\
    \ `/blood-stock`, `/requests/summary`, `/facilities`, `/changes`)\n  menerima\
    \ X-API-Key atau JWT.\n\n**Format respons**\n- Sukses: `{\"data\": ..., \"meta\"\
    : {\"seq\", \"updated_at\", \"source\", \"stale\"}}`.\n- Error: `{\"error\": {\"\
    code\", \"message\", \"request_id\"}}`.\n"
  version: 0.2.0
paths:
  /requests:
    post:
      tags:
      - permintaan-darah
      summary: Ajukan permintaan darah
      operationId: create_requests_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - permintaan-darah
      summary: Semua permintaan (petugas)
      operationId: list_all_requests_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - submitted
            - verified
            - searching
            - fulfilled
            - expired
            - cancelled
            - rejected
            type: string
          - type: 'null'
          title: Status
      - name: facility_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Facility Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Jumlah data per halaman (maks 200)
          default: 50
          title: Limit
        description: Jumlah data per halaman (maks 200)
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

components:
  schemas:
    ArrivalIn:
      properties:
        code:
          type: string
          maxLength: 6
          minLength: 6
          title: Code
          description: Kode kedatangan yang ditunjukkan pendonor
        outcome:
          type: string
          enum:
          - donated
          - deferred
          - no_show
          title: Outcome
      type: object
      required:
      - code
      - outcome
      title: ArrivalIn
    CancelIn:
      properties:
        reason:
          type: string
          maxLength: 200
          minLength: 3
          title: Reason
      type: object
      required:
      - reason
      title: CancelIn
    DonorProfileIn:
      properties:
        display_name:
          type: string
          maxLength: 80
          minLength: 2
          title: Display Name
        blood_type:
          type: string
          enum:
          - a
          - b
          - ab
          - o
          title: Blood Type
        rhesus:
          type: string
          enum:
          - positive
          - negative
          title: Rhesus
        birth_date:
          type: string
          format: date
          title: Birth Date
        weight_kg:
          type: number
          maximum: 250.0
          minimum: 30.0
          title: Weight Kg
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
          description: Perkiraan lokasi domisili
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
        available:
          type: boolean
          title: Available
          description: Bersedia menerima undangan donor
          default: true
      type: object
      required:
      - display_name
      - blood_type
      - rhesus
      - birth_date
      - weight_kg
      - lat
      - lon
      title: DonorProfileIn
    EventIn:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 3
          title: Name
        organizer:
          type: string
          maxLength: 120
          minLength: 2
          title: Organizer
        facility_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Facility Id
          description: Opsional; koordinat diambil dari fasilitas
        address:
          type: string
          maxLength: 200
          title: Address
          default: ''
        lat:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Lat
        lon:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          title: Lon
        opens_at:
          type: string
          format: date-time
          title: Opens At
        closes_at:
          type: string
          format: date-time
          title: Closes At
        capacity_per_hour:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Capacity Per Hour
      type: object
      required:
      - name
      - organizer
      - opens_at
      - closes_at
      - capacity_per_hour
      title: EventIn
    FacilityIn:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 3
          title: Name
        kind:
          type: string
          enum:
          - udd
          - hospital
          - bdrs
          title: Kind
        address:
          type: string
          maxLength: 200
          title: Address
          default: ''
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
        lon:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lon
      type: object
      required:
      - name
      - kind
      - lat
      - lon
      title: FacilityIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    OutcomeIn:
      properties:
        outcome:
          type: string
          enum:
          - donated
          - deferred
          - no_show
          title: Outcome
      type: object
      required:
      - outcome
      title: OutcomeIn
    RequestIn:
      properties:
        facility_id:
          type: string
          title: Facility Id
          description: ID fasilitas tujuan, mis. fac_1
        patient_ref:
          type: string
          maxLength: 40
          minLength: 3
          title: Patient Ref
          description: Nomor formulir permintaan darah RS
        blood_type:
          type: string
          enum:
          - a
          - b
          - ab
          - o
          title: Blood Type
        rhesus:
          type: string
          enum:
          - positive
          - negative
          title: Rhesus
        component:
          type: string
          enum:
          - whole_blood
          - prc
          - platelets
          - plasma
          title: Component
        units:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Units
          description: Jumlah kantong
        urgency:
          type: string
          enum:
          - normal
          - urgent
          - emergency
          title: Urgency
          default: normal
        needed_by:
          type: string
          format: date-time
          title: Needed By
          description: Batas waktu, ISO 8601 dengan zona waktu
      type: object
      required:
      - facility_id
      - patient_ref
      - blood_type
      - rhesus
      - component
      - units
      - needed_by
      title: RequestIn
    ReservationIn:
      properties:
        slot_start:
          type: string
          format: date-time
          title: Slot Start
      type: object
      required:
      - slot_start
      title: ReservationIn
    ScenarioIn:
      properties:
        name:
          type: string
          enum:
          - emergency_request
          - stock_low
          - event_full
          - mass_arrival
          - reset
          title: Name
        lat:
          anyOf:
          - type: number
          - type: 'null'
          title: Lat
        lon:
          anyOf:
          - type: number
          - type: 'null'
          title: Lon
      type: object
      required:
      - name
      title: ScenarioIn
    ScreeningIn:
      properties:
        feeling_healthy:
          type: boolean
          title: Feeling Healthy
        fever_last_2_weeks:
          type: boolean
          title: Fever Last 2 Weeks
        antibiotics_last_week:
          type: boolean
          title: Antibiotics Last Week
        tattoo_or_piercing_last_6_months:
          type: boolean
          title: Tattoo Or Piercing Last 6 Months
        pregnant_or_breastfeeding:
          type: boolean
          title: Pregnant Or Breastfeeding
        transfusion_last_year:
          type: boolean
          title: Transfusion Last Year
      type: object
      required:
      - feeling_healthy
      - fever_last_2_weeks
      - antibiotics_last_week
      - tattoo_or_piercing_last_6_months
      - pregnant_or_breastfeeding
      - transfusion_last_year
      title: ScreeningIn
    StockItemIn:
      properties:
        blood_type:
          type: string
          enum:
          - a
          - b
          - ab
          - o
          title: Blood Type
        rhesus:
          type: string
          enum:
          - positive
          - negative
          title: Rhesus
        component:
          type: string
          enum:
          - whole_blood
          - prc
          - platelets
          - plasma
          title: Component
        units:
          type: integer
          maximum: 100000.0
          minimum: 0.0
          title: Units
      type: object
      required:
      - blood_type
      - rhesus
      - component
      - units
      title: StockItemIn
    StockUpdateIn:
      properties:
        items:
          items:
            $ref: '#/components/schemas/StockItemIn'
          type: array
          maxItems: 64
          minItems: 1
          title: Items
      type: object
      required:
      - items
      title: StockUpdateIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VerifyIn:
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
          title: Decision
        reason:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Reason
      type: object
      required:
      - decision
      title: VerifyIn
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key

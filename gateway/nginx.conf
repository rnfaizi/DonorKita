# Gateway DonorKita: satu-satunya pintu masuk ke core-service dan auth-service.
#   /api/auth/*          -> auth:8000   (login dibatasi 10 permintaan/menit per IP, burst 10)
#   /api/auth/internal/* -> diblokir (hanya untuk core di jaringan Docker)
#   /api/*               -> core:8000   (10 permintaan/detik per IP, burst 20)
# Error gateway dikembalikan dalam envelope error klaster (AGENTS.md bagian 3).
worker_processes 1;
events { worker_connections 256; }

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # Kunci pembatasan: IP asli pengunjung dari Cloudflare Tunnel, atau IP koneksi bila akses langsung (LAN).
  map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
  }
  limit_req_zone $client_ip zone=api:5m   rate=10r/s;
  limit_req_zone $client_ip zone=login:5m rate=10r/m;
  limit_req_status 429;

  # Teruskan X-Request-ID dari klien, atau buat baru, agar log gateway dan service dapat dicocokkan.
  map $http_x_request_id $req_id {
    ""      $request_id;
    default $http_x_request_id;
  }

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $client_ip;
  proxy_set_header X-Forwarded-For   $client_ip;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Request-ID      $req_id;
  proxy_connect_timeout 5s;
  proxy_read_timeout    30s;

  server {
    listen 80;
    client_max_body_size 256k;

    error_page 429 = @rate_limited;
    error_page 502 503 504 = @upstream_down;

    location @rate_limited {
      default_type application/json;
      add_header Retry-After 1 always;
      return 429 '{"error":{"code":"rate_limited","message":"Terlalu banyak permintaan","request_id":"$req_id"}}';
    }

    location @rate_limited_login {
      default_type application/json;
      add_header Retry-After 6 always;
      return 429 '{"error":{"code":"rate_limited","message":"Terlalu banyak percobaan login","request_id":"$req_id"}}';
    }

    location @upstream_down {
      default_type application/json;
      return 503 '{"error":{"code":"upstream_unavailable","message":"Layanan belum siap","request_id":"$req_id"}}';
    }

    # Cek gateway sendiri (dipakai healthcheck Docker)
    location = /health {
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    location ^~ /api/auth/internal {
      default_type application/json;
      return 404 '{"error":{"code":"not_found","message":"Data tidak ditemukan","request_id":"$req_id"}}';
    }

    location = /api/auth/login {
      limit_req zone=login burst=10 nodelay;
      error_page 429 = @rate_limited_login;
      proxy_pass http://auth:8000/login;
    }

    location /api/auth/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://auth:8000/;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://core:8000/;
    }

    location = / {
      default_type application/json;
      return 200 '{"service":"DonorKita","docs":"/api/docs","auth_docs":"/api/auth/docs","health":"/api/health"}';
    }

    location / {
      default_type application/json;
      return 404 '{"error":{"code":"not_found","message":"Data tidak ditemukan","request_id":"$req_id"}}';
    }
  }
}
